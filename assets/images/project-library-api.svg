<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
  </defs>
  <rect width="1160" height="720" fill="url(#bg2)"/>
  <rect x="30" y="30" width="1100" height="660" rx="16" fill="#27272A" fill-opacity="0.6" stroke="#3F3F46" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="6" fill="#EF4444"/>
  <circle cx="80" cy="60" r="6" fill="#F59E0B"/>
  <circle cx="100" cy="60" r="6" fill="#10B981"/>
  <text x="580" y="64" fill="#A1A1AA" font-family="sans-serif" font-size="13" font-weight="500" text-anchor="middle">api.library.domain.v1 // Spring Boot 3 + PostgreSQL</text>

  <!-- Left: Endpoints list -->
  <rect x="60" y="100" width="460" height="560" rx="12" fill="#18181B" stroke="#3F3F46" stroke-width="1"/>
  <text x="84" y="140" fill="#F4F4F5" font-family="sans-serif" font-size="16" font-weight="700">RESTful API Endpoints</text>
  
  <rect x="84" y="165" width="412" height="52" rx="8" fill="#27272A"/>
  <rect x="96" y="179" width="50" height="24" rx="4" fill="#10B981"/>
  <text x="108" y="195" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700">GET</text>
  <text x="160" y="196" fill="#E4E4E7" font-family="monospace" font-size="13">/api/v1/books?page=0&amp;size=20</text>

  <rect x="84" y="230" width="412" height="52" rx="8" fill="#27272A"/>
  <rect x="96" y="244" width="50" height="24" rx="4" fill="#3B82F6"/>
  <text x="105" y="260" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700">POST</text>
  <text x="160" y="261" fill="#E4E4E7" font-family="monospace" font-size="13">/api/v1/books/circulate</text>

  <rect x="84" y="295" width="412" height="52" rx="8" fill="#27272A"/>
  <rect x="96" y="309" width="50" height="24" rx="4" fill="#F59E0B"/>
  <text x="108" y="325" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700">PUT</text>
  <text x="160" y="326" fill="#E4E4E7" font-family="monospace" font-size="13">/api/v1/members/{id}/renew</text>

  <rect x="84" y="360" width="412" height="52" rx="8" fill="#27272A"/>
  <rect x="96" y="374" width="50" height="24" rx="4" fill="#EF4444"/>
  <text x="102" y="390" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700">DEL</text>
  <text x="160" y="391" fill="#E4E4E7" font-family="monospace" font-size="13">/api/v1/books/{isbn}</text>

  <rect x="84" y="435" width="412" height="200" rx="8" fill="#09090B" stroke="#3F3F46" stroke-width="1"/>
  <text x="104" y="465" fill="#71717A" font-family="sans-serif" font-size="12" font-weight="600">ARCHITECTURE STACK</text>
  <text x="104" y="495" fill="#F4F4F5" font-family="sans-serif" font-size="14">• Controller-Service-Repository Pattern</text>
  <text x="104" y="525" fill="#F4F4F5" font-family="sans-serif" font-size="14">• Spring Data JPA + Hibernate ORM</text>
  <text x="104" y="555" fill="#F4F4F5" font-family="sans-serif" font-size="14">• PostgreSQL Relational Persistence</text>
  <text x="104" y="585" fill="#F4F4F5" font-family="sans-serif" font-size="14">• Global RFC-7807 Error Exception Handlers</text>

  <!-- Right: JSON Response inspector -->
  <rect x="545" y="100" width="555" height="560" rx="12" fill="#18181B" stroke="#3F3F46" stroke-width="1"/>
  <text x="575" y="140" fill="#F4F4F5" font-family="sans-serif" font-size="16" font-weight="700">HTTP 200 OK — Response Payload (14ms)</text>
  <rect x="575" y="165" width="495" height="470" rx="8" fill="#09090B" stroke="#27272A" stroke-width="1"/>
  <text x="595" y="200" fill="#10B981" font-family="monospace" font-size="13">{</text>
  <text x="615" y="230" fill="#93C5FD" font-family="monospace" font-size="13">"status": <span fill="#FCD34D">200</span>,</text>
  <text x="615" y="260" fill="#93C5FD" font-family="monospace" font-size="13">"message": <span fill="#86EFAC">"Book loaned successfully"</span>,</text>
  <text x="615" y="290" fill="#93C5FD" font-family="monospace" font-size="13">"transaction": {</text>
  <text x="640" y="320" fill="#93C5FD" font-family="monospace" font-size="13">"id": <span fill="#FCD34D">9842</span>,</text>
  <text x="640" y="350" fill="#93C5FD" font-family="monospace" font-size="13">"isbn": <span fill="#86EFAC">"978-0134685991"</span>,</text>
  <text x="640" y="380" fill="#93C5FD" font-family="monospace" font-size="13">"title": <span fill="#86EFAC">"Effective Java 3rd Ed"</span>,</text>
  <text x="640" y="410" fill="#93C5FD" font-family="monospace" font-size="13">"member": <span fill="#86EFAC">"Mohan Prasad"</span>,</text>
  <text x="640" y="440" fill="#93C5FD" font-family="monospace" font-size="13">"dueDate": <span fill="#86EFAC">"2026-11-20T12:00:00Z"</span></text>
  <text x="615" y="470" fill="#93C5FD" font-family="monospace" font-size="13">},</text>
  <text x="615" y="500" fill="#93C5FD" font-family="monospace" font-size="13">"latencyMs": <span fill="#FCD34D">14</span></text>
  <text x="595" y="530" fill="#10B981" font-family="monospace" font-size="13">}</text>
</svg>